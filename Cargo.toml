[workspace]
resolver = "3"
members = ["crates/core", "crates/firmware"]
# its own workspace: the collector needs std, which the C6 target that
# rust-analyzer checks everything for doesn't have
exclude = ["crates/collector"]
# plain `cargo test` / `cargo build` stay on the Mac; firmware needs --target (see makefile)
default-members = ["crates/core"]

[profile.dev]
# unoptimized builds are too slow and too big for the C6
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
