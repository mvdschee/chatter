[package]
name = "chatter-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "chatter-firmware"
path = "src/main.rs"
test = false

[[test]]
name = "smoke"
harness = false

[dependencies]
chatter-core = { path = "../core" }

# HAL and runtime
esp-hal = { version = "=1.2.2", features = ["defmt", "esp32c6", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["defmt", "embassy", "esp-alloc", "esp-radio", "esp32c6"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["defmt", "esp32c6"] }
esp-alloc = { version = "=0.11.0", features = ["defmt", "esp32c6"] }

# Wi-Fi
esp-radio = { version = "=1.0.0-beta.1", features = ["defmt", "esp-alloc", "esp32c6", "sniffer", "unstable", "wifi"] }
critical-section = "1.2.0"
embassy-sync = "0.8.0"
static_cell = "2.1.1"

# Async
embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-time = { version = "=0.5.0", features = ["defmt"] }

# Logging over RTT
defmt = "1.2.0"
rtt-target = { version = "0.6.2", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }

[dev-dependencies]
# on-device tests, flashed and run over probe-rs
embedded-test = { version = "=0.7.2", features = ["defmt", "embassy-010", "external-executor"] }

[lints.rust]
unsafe_code = "forbid"
# early development; remove once the firmware has settled
dead_code = "allow"
unused = "allow"
