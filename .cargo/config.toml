# No [build] target here: core's tests run on the Mac. The makefile passes
# --target for the firmware.
[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip=esp32c6 --preverify --always-print-stacktrace --no-location"

# the ESP32-C3 test client (testclient/)
[target.riscv32imc-unknown-none-elf]
runner = "probe-rs run --chip=esp32c3 --preverify --always-print-stacktrace --no-location"

[env]
DEFMT_LOG = "info"
