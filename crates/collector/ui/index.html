<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatter</title>
<!--
  The monitoring page (docs/monitoring.md). The collector serves it with
  style.css and the scripts, ES modules from main.js on; they load the data
  from /v1/overview, /v1/timeline, /v1/plan and /v1/identify, and save the
  plan there.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
	<main class="map">
		<header class="top">
			<div class="seg" role="group" aria-label="Panels">
				<button id="devices-btn" aria-expanded="false" aria-controls="side">Devices</button>
				<button id="events-btn" aria-expanded="false" aria-controls="side">Events</button>
			</div>
			<button class="ghost" id="identify-btn"><svg class="icon" aria-hidden="true"><use href="icons.svg#crosshair"/></svg>Identify</button>
			<button class="ghost" id="edit-btn"><svg class="icon" aria-hidden="true"><use href="icons.svg#pencil-ruler"/></svg>Edit plan</button>
			<span class="rule" aria-hidden="true"></span>
			<button class="status" id="sensors-btn" aria-expanded="false" aria-controls="side"><span class="dot"></span>Sensors<span class="sub" id="sensors-sub"></span></button>
			<div class="clock" id="clock">--:--:--</div>
		</header>
		<canvas id="plan" tabindex="0" aria-label="Floor plan with devices and their traffic. Drag to move, shift-drag to rotate, scroll to zoom; or the arrow keys, + and -. Use the device list to pick one."></canvas>
		<div class="view-ctl">
			<span class="hint">drag: move · shift-drag: rotate · scroll: zoom</span>
			<div class="icon-group" role="group" aria-label="Camera">
				<button id="rot-left" aria-label="Rotate left" title="Rotate left"><svg class="icon" aria-hidden="true"><use href="icons.svg#rotate-ccw"/></svg></button>
				<button id="rot-right" aria-label="Rotate right" title="Rotate right"><svg class="icon" aria-hidden="true"><use href="icons.svg#rotate-cw"/></svg></button>
				<button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg class="icon" aria-hidden="true"><use href="icons.svg#zoom-out"/></svg></button>
				<button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg class="icon" aria-hidden="true"><use href="icons.svg#zoom-in"/></svg></button>
				<button id="view-reset" aria-label="Reset the view" title="Reset the view"><svg class="icon" aria-hidden="true"><use href="icons.svg#scan"/></svg></button>
			</div>
		</div>
		<div class="editor" id="editor" hidden>
			<ol class="edit-steps" id="edit-steps" aria-label="Steps">
				<li data-step="image" title="Load the floor plan">
					<button class="tl-btn" id="underlay-load">Image</button>
					<button class="tl-btn" id="underlay-show" aria-pressed="true" disabled>Show</button>
					<button class="tl-btn" id="underlay-remove" disabled>Remove</button>
				</li>
				<li data-step="scale" title="Measure a wall">
					<button class="tl-btn" data-tool="scale" aria-pressed="false" disabled>Scale</button>
				</li>
				<li data-step="turn" title="Turn it">
					<button class="tl-btn" id="turn-left" disabled title="A quarter turn anticlockwise">Left</button>
					<button class="tl-btn" id="turn-right" disabled title="A quarter turn clockwise">Right</button>
				</li>
				<li data-step="rooms" title="Trace the rooms">
					<button class="tl-btn" data-tool="box" aria-pressed="true">Box</button>
					<button class="tl-btn" data-tool="lines" aria-pressed="false">Lines</button>
					<button class="tl-btn" data-tool="door" aria-pressed="false">Doors</button>
					<button class="tl-btn" data-tool="window" aria-pressed="false">Windows</button>
				</li>
				<li data-step="place" title="Place things">
					<button class="tl-btn" data-tool="place" aria-pressed="false">Place</button>
				</li>
				<li data-step="save" title="Name them and save">
					<button class="tl-btn" id="edit-cancel">Cancel</button>
					<button class="tl-btn" id="edit-save">Save</button>
				</li>
			</ol>
			<canvas id="edit-plan" tabindex="0" aria-label="The floor plan from above, for drawing rooms. The panel beside it says how."></canvas>
			<div class="edit-handle" id="edit-handle" role="separator" aria-orientation="vertical" aria-label="Panel width: drag, or the arrow keys; double-click for the usual width" tabindex="0"></div>
			<aside class="edit-side" aria-label="Edit plan">
				<p id="edit-status" role="status"></p>
				<div class="edit-guide" id="edit-guide"></div>
				<div class="edit-kind" id="edit-kind" role="group" aria-label="Window" hidden>
					<button class="tl-btn" data-kind="window" aria-pressed="true" title="From the floor up, the wall above it left">Full</button>
					<button class="tl-btn" data-kind="half" aria-pressed="false" title="From half height up, the wall above it left">Half</button>
				</div>
				<input type="file" id="underlay-file" accept="image/png,image/jpeg,image/webp" hidden>
				<section class="edit-things" id="edit-things" hidden aria-label="Things to place">
					<h2 class="eyebrow">Things</h2>
					<div class="thing-detail" id="thing-detail"></div>
					<input class="edit-filter" id="things-filter" type="search" placeholder="Find: name, vendor, IP or MAC" aria-label="Find a thing">
					<ul class="edit-list" id="things-list"></ul>
					<datalist id="carriers"></datalist>
				</section>
				<section class="edit-rooms-part" id="edit-rooms-part" aria-label="Rooms">
					<h2 class="eyebrow">Rooms</h2>
					<ul class="edit-rooms" id="edit-rooms"></ul>
				</section>
				<details class="edit-keys">
					<summary class="eyebrow">Keys</summary>
					<dl class="edit-help" id="edit-help"></dl>
				</details>
			</aside>
		</div>
	</main>

	<section class="timeline" aria-label="Traffic over the last 24 hours">
		<div class="tl-head">
			<button class="tl-btn" id="play">Play</button>
			<button class="tl-btn" id="live" aria-pressed="true">Live</button>
			<span class="ranges" id="ranges"></span>
			<button class="tl-btn" id="zoom-out-tl" hidden title="back to the whole range (double-click, Esc)">Zoom out</button>
			<span id="tl-at"></span>
			<button class="tl-btn peak" id="peak"></button>
		</div>
		<canvas id="heat" tabindex="0" aria-label="The network's traffic over the chosen range. Drag, or use the arrow keys, to replay a moment on the plan; shift-drag to zoom in."></canvas>
	</section>

	<aside class="side" id="side" aria-label="Device details"></aside>

	<section class="identify" id="identify" hidden aria-label="Identify">
		<header class="id-head">
			<button class="id-back" id="id-close">← Back</button>
			<h1 class="name">Identify</h1>
		</header>
		<ol class="id-steps" id="id-steps" aria-label="Steps">
			<li>Sensor</li><li>Move it</li><li>Find</li><li>Put back</li>
		</ol>
		<div class="id-main" id="id-main" role="status"></div>
		<div class="id-ctl" id="id-ctl" hidden>
			<span id="id-left"></span>
			<button class="tl-btn" data-act="more">+10 min</button>
			<button class="tl-btn" data-act="stop">Stop</button>
		</div>
		<div class="id-find-part" id="id-find-part" hidden>
			<div class="id-tabs">
				<button class="tl-btn" data-tab="here" aria-pressed="true">What's here</button>
				<button class="tl-btn" data-tab="find" aria-pressed="false">Find</button>
			</div>
			<input class="edit-filter" id="id-find" type="search" placeholder="Find: name, vendor, IP or MAC" aria-label="Find a device" hidden>
			<div class="id-body" id="id-body"></div>
		</div>
	</section>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
