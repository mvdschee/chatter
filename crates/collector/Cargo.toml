[package]
name = "chatter-collector"
version = "0.1.0"
edition = "2024"
publish = false
description = "Collector: stores the sensors' reports in SQLite, and serves the test client's download"

[dependencies]
# Async
tokio = { version = "1.53.3", features = ["full"] }

# HTTP
axum = "0.8.9"

# Database: SQLite, built from the C source sqlx ships (no system library);
# no extension loading
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }

# Json
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

# Errors and logging
thiserror = "2.0.21"
chrono = "0.4.45"

# Config: .env for local runs; a container gets the same keys from its environment
dotenvy = "0.15.7"

[lints.rust]
unsafe_code = "forbid"

# not part of the main workspace (see ../../Cargo.toml): it needs std
[workspace]
